<div class="auth-wrapper">
    <div class="card auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 30px; font-weight: 800; margin-bottom: 8px;">Welcome back</h2>
        <p style="color: var(--text-muted);">Enter your details to log in to ConnectSphere.</p>
      </div>
  
      <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
      </div>
  
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="email" 
            placeholder="Enter your email" 
            required>
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••">
        </div>
  
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 16px;" [disabled]="loading">
             {{ loading ? 'Authenticating...' : 'Log In' }}
        </button>
      </form>
  
      <p style="text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 14px;">
        Don't have an account? <a routerLink="/register" style="color: var(--twitter-blue); font-weight: bold;">Sign up</a>
      </p>
    </div>
  </div>
