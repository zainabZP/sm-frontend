<div class="auth-wrapper">
    <div class="card auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-size: 30px; font-weight: 800; margin-bottom: 8px;">Join ConnectSphere</h2>
        <p style="color: var(--text-muted);">Create your account seamlessly.</p>
      </div>
  
      <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
      </div>
  
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Username</label>
          <input type="text" [(ngModel)]="username" name="username" placeholder="Choose a unique username">
        </div>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Your Display Name">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" [(ngModel)]="email" name="email" placeholder="example@gmail.com">
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••">
        </div>
  
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 16px;" [disabled]="loading">
            {{ loading ? 'Creating Account...' : 'Sign Up' }}
        </button>
      </form>
  
      <p style="text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 14px;">
        Already registered? <a routerLink="/login" style="color: var(--twitter-blue); font-weight: bold;">Log in here</a>
      </p>
    </div>
  </div>
