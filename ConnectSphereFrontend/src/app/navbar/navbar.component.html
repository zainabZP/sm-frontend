<div class="nav-brand" style="margin-bottom: 30px; margin-top: 10px; padding: 0 16px;">

</div>

<nav>
    <a routerLink="/feed" routerLinkActive="active-link" class="nav-item">

    </a>
    <a routerLink="/search" routerLinkActive="active-link" class="nav-item">
        <span class="icon">🔍</span>

        <span class="icon">👤</span>
        <span class="label">Profile</span>
    </a>
