<div class="app-container">
  <!-- Left Navigation Bar (Twitter Style) -->
  <aside class="left-sidebar">
    <app-navbar></app-navbar>
  </aside>

  <!-- Main Feed & Dynamic Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Right Trending/Suggested Bar -->
  <aside class="right-sidebar">
    <!-- Hashtag Search -->
    <div class="card" style="margin-top: 20px; padding: 20px;">
      <h3 style="margin-bottom: 20px; font-size: 18px; font-weight: 800;">Search Hashtag</h3>
      <div style="position: relative;">
        <input 
          type="text" 
          [(ngModel)]="hashtagQuery" 
          (keyup.enter)="searchHashtag()"
          placeholder="Search #hashtag" 
          style="width: 100%; padding: 12px 16px; background: var(--border-color); border: none; border-radius: 25px; color: var(--text-main); font-size: 15px;">
      </div>
    </div>

    <!-- Who to Follow -->
    <div class="card" style="margin-top: 24px; padding: 20px;">
      <h3 style="margin-bottom: 20px; font-size: 18px; font-weight: 800;">Who to follow</h3>
      
      <div *ngIf="recommendations.length === 0" style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 10px;">
        No recommendations right now.
      </div>

      <div *ngFor="let rec of recommendations" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
        <div style="display: flex; gap: 12px; align-items: center; cursor: pointer;" [routerLink]="['/profile', rec.userId]">
          <div class="avatar-placeholder" [style.background-image]="rec.avatarUrl ? 'url(' + rec.avatarUrl + ')' : ''" style="width: 40px; height: 40px; border-radius: 50%; background-size: cover; background-position: center;"></div>
          <div style="overflow: hidden; max-width: 120px;">
            <div style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ rec.fullName }}</div>
            <div style="color: var(--text-muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">&#64;{{ rec.userName }}</div>
          </div>
        </div>
        <button class="btn-primary" (click)="followUser(rec.userId)" style="padding: 6px 16px; font-size: 14px; background: white; color: black; font-weight: 700;">Follow</button>
      </div>
    </div>
  </aside>
</div>
